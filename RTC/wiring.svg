<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Nối dây DS1307 (Tiny RTC) ↔ Raspberry Pi Zero W</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#555">Nhìn từ trên xuống, header 40 chân ở mép trên board, khe thẻ nhớ bên trái</text>

  <!-- Pi Zero W board -->
  <rect x="30" y="90" width="520" height="230" rx="18" fill="#1f7a3a" stroke="#0f4d22" stroke-width="3"/>
  <text x="290" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#e8f5ea">Raspberry Pi Zero W</text>
  <rect x="34" y="170" width="44" height="60" rx="4" fill="#c9c9c9" stroke="#888"/>
  <text x="56" y="250" text-anchor="middle" font-size="11" fill="#e8f5ea">thẻ SD</text>
  <rect x="200" y="190" width="70" height="60" rx="4" fill="#2b2b2b"/>
  <text x="235" y="225" text-anchor="middle" font-size="11" fill="#bbb">BCM2835</text>

  <!-- header: 20 columns, pitch 22, start x=90 -->
  <rect x="80" y="100" width="450" height="56" rx="4" fill="#222"/>
  <g id="pins">
    <!-- top row (even pins, board edge) y=114 ; bottom row (odd pins) y=142 -->
    <g fill="#d4af37">
      <circle cx="91" cy="114" r="6"/><circle cx="113" cy="114" r="6"/><circle cx="135" cy="114" r="6"/>
      <circle cx="157" cy="114" r="6"/><circle cx="179" cy="114" r="6"/><circle cx="201" cy="114" r="6"/>
      <circle cx="223" cy="114" r="6"/><circle cx="245" cy="114" r="6"/><circle cx="267" cy="114" r="6"/>
      <circle cx="289" cy="114" r="6"/><circle cx="311" cy="114" r="6"/><circle cx="333" cy="114" r="6"/>
      <circle cx="355" cy="114" r="6"/><circle cx="377" cy="114" r="6"/><circle cx="399" cy="114" r="6"/>
      <circle cx="421" cy="114" r="6"/><circle cx="443" cy="114" r="6"/><circle cx="465" cy="114" r="6"/>
      <circle cx="487" cy="114" r="6"/><circle cx="509" cy="114" r="6"/>
      <rect x="85" y="136" width="12" height="12"/>
      <circle cx="113" cy="142" r="6"/><circle cx="135" cy="142" r="6"/>
      <circle cx="157" cy="142" r="6"/><circle cx="179" cy="142" r="6"/><circle cx="201" cy="142" r="6"/>
      <circle cx="223" cy="142" r="6"/><circle cx="245" cy="142" r="6"/><circle cx="267" cy="142" r="6"/>
      <circle cx="289" cy="142" r="6"/><circle cx="311" cy="142" r="6"/><circle cx="333" cy="142" r="6"/>
      <circle cx="355" cy="142" r="6"/><circle cx="377" cy="142" r="6"/><circle cx="399" cy="142" r="6"/>
      <circle cx="421" cy="142" r="6"/><circle cx="443" cy="142" r="6"/><circle cx="465" cy="142" r="6"/>
      <circle cx="487" cy="142" r="6"/><circle cx="509" cy="142" r="6"/>
    </g>
    <!-- highlight used pins -->
    <circle cx="113" cy="114" r="8" fill="none" stroke="#e53935" stroke-width="3"/>
    <circle cx="135" cy="114" r="8" fill="none" stroke="#111" stroke-width="3"/>
    <circle cx="113" cy="142" r="8" fill="none" stroke="#1e63d6" stroke-width="3"/>
    <circle cx="135" cy="142" r="8" fill="none" stroke="#f0a000" stroke-width="3"/>
  </g>
  <!-- pin legend under board -->
  <g font-size="13" fill="#1a1a1a">
    <text x="40" y="350" font-weight="700">Header (5 cột đầu):</text>
    <text x="40" y="372">Hàng mép board :  ② 5V   ④ 5V   ⑥ GND   (8) GPIO14   (10) GPIO15</text>
    <text x="40" y="394">Hàng trong     :  ① 3V3  ③ GPIO2/SDA1  ⑤ GPIO3/SCL1  ⑦ GPIO4  ⑨ GND</text>
    <text x="40" y="416" fill="#555">Chân ① có pad VUÔNG, nằm ở đầu gần khe thẻ SD.</text>
  </g>

  <!-- DS1307 module -->
  <rect x="690" y="110" width="230" height="290" rx="10" fill="#1d4fa3" stroke="#12336b" stroke-width="3"/>
  <text x="805" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Module DS1307</text>
  <text x="805" y="160" text-anchor="middle" font-size="12" fill="#cfe0ff">(Tiny RTC: DS1307 + AT24C32)</text>
  <circle cx="850" cy="335" r="46" fill="#bfc5cc" stroke="#7d848c" stroke-width="3"/>
  <text x="850" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#333">CR2032</text>
  <text x="850" y="349" text-anchor="middle" font-size="12" fill="#333">(+) lên trên</text>
  <rect x="840" y="185" width="56" height="34" rx="3" fill="#222"/>
  <text x="868" y="206" text-anchor="middle" font-size="10" fill="#ddd">DS1307</text>
  <rect x="851" y="236" width="34" height="14" rx="7" fill="#d9d9d9"/>
  <text x="868" y="266" text-anchor="middle" font-size="9" fill="#cfe0ff">32.768kHz</text>

  <!-- module pins at left edge x=690 -->
  <g font-size="13" font-weight="700">
    <rect x="676" y="180" width="14" height="14" fill="#d4af37"/><text x="698" y="192" text-anchor="start" fill="#9fb3d6">SQ</text>
    <rect x="676" y="204" width="14" height="14" fill="#d4af37"/><text x="698" y="216" text-anchor="start" fill="#9fb3d6">DS</text>
    <rect x="676" y="228" width="14" height="14" fill="#d4af37"/><text x="698" y="240" text-anchor="start" fill="#ffffff">SCL</text>
    <rect x="676" y="252" width="14" height="14" fill="#d4af37"/><text x="698" y="264" text-anchor="start" fill="#ffffff">SDA</text>
    <rect x="676" y="276" width="14" height="14" fill="#d4af37"/><text x="698" y="288" text-anchor="start" fill="#ffffff">VCC</text>
    <rect x="676" y="300" width="14" height="14" fill="#d4af37"/><text x="698" y="312" text-anchor="start" fill="#ffffff">GND</text>
    <rect x="676" y="324" width="14" height="14" fill="#d4af37"/><text x="698" y="336" text-anchor="start" fill="#9fb3d6">BAT</text>
  </g>

  <!-- wires -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- pin 2 5V (113,114) -> VCC (676,283) -->
    <path d="M113 106 L113 74 L590 74 L590 283 L676 283" stroke="#e53935"/>
    <!-- pin 6 GND (135,114) -> GND (676,307) -->
    <path d="M135 106 L135 66 L606 66 L606 307 L676 307" stroke="#111"/>
    <!-- pin 3 SDA (113,142) -> SDA (676,259) -->
    <path d="M113 150 L113 168 L574 168 L574 259 L676 259" stroke="#1e63d6"/>
    <!-- pin 5 SCL (135,142) -> SCL (676,235) -->
    <path d="M135 150 L135 160 L558 160 L558 235 L676 235" stroke="#f0a000"/>
  </g>

  <!-- fix top labels: show 2,4,6 above even pins -->
  <g font-size="11" text-anchor="middle" font-weight="700">
    <text x="91" y="96" fill="#d4d4d4">2</text>
    <text x="113" y="96" fill="#fff">4</text>
    <text x="135" y="96" fill="#fff">6</text>
    <text x="91" y="170" fill="#fff">1</text>
  </g>

  <!-- connection table -->
  <g font-size="14">
    <rect x="30" y="440" width="900" height="140" rx="10" fill="#f6f7f9" stroke="#d6d9de"/>
    <text x="50" y="466" font-weight="700" fill="#1a1a1a">Dây</text>
    <text x="170" y="466" font-weight="700" fill="#1a1a1a">Module DS1307</text>
    <text x="340" y="466" font-weight="700" fill="#1a1a1a">Pi Zero W (chân vật lý)</text>
    <text x="580" y="466" font-weight="700" fill="#1a1a1a">Ghi chú</text>
    <rect x="50" y="478" width="60" height="8" fill="#e53935"/><text x="170" y="487">VCC</text><text x="340" y="487">Chân 4 (5V)  — hoặc chân 2</text><text x="580" y="487">DS1307 cần 4.5–5.5 V, KHÔNG dùng 3.3 V</text>
    <rect x="50" y="502" width="60" height="8" fill="#111"/><text x="170" y="511">GND</text><text x="340" y="511">Chân 6 (GND)</text><text x="580" y="511">Mass chung</text>
    <rect x="50" y="526" width="60" height="8" fill="#1e63d6"/><text x="170" y="535">SDA</text><text x="340" y="535">Chân 3 (GPIO2 / SDA1)</text><text x="580" y="535">Pi có sẵn trở kéo 1.8 kΩ lên 3.3 V</text>
    <rect x="50" y="550" width="60" height="8" fill="#f0a000"/><text x="170" y="559">SCL</text><text x="340" y="559">Chân 5 (GPIO3 / SCL1)</text><text x="580" y="559">Bỏ trở kéo 5 V trên module (xem README)</text>
  </g>
</svg>
