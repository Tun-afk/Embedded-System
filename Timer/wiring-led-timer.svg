<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Nối LED test driver Timer ↔ Raspberry Pi Zero W</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#555">Nhìn từ trên xuống, header ở mép trên, khe thẻ SD bên trái · 4 dây DS1307 (chân 3–6) giữ nguyên</text>

  <!-- board -->
  <rect x="30" y="80" width="560" height="200" rx="18" fill="#1f7a3a" stroke="#0f4d22" stroke-width="3"/>
  <text x="190" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#e8f5ea">Raspberry Pi Zero W</text>
  <rect x="34" y="150" width="44" height="60" rx="4" fill="#c9c9c9" stroke="#888"/>
  <text x="56" y="230" text-anchor="middle" font-size="11" fill="#e8f5ea">thẻ SD</text>

  <!-- header first 8 columns: x = 110 + 52*(col-1); even row y=112, odd row y=146 -->
  <rect x="88" y="92" width="480" height="74" rx="5" fill="#222"/>
  <g fill="#d4af37">
    <circle cx="110" cy="112" r="8"/><circle cx="162" cy="112" r="8"/><circle cx="214" cy="112" r="8"/><circle cx="266" cy="112" r="8"/>
    <circle cx="318" cy="112" r="8"/><circle cx="370" cy="112" r="8"/><circle cx="422" cy="112" r="8"/><circle cx="474" cy="112" r="8"/>
    <rect x="102" y="138" width="16" height="16"/>
    <circle cx="162" cy="146" r="8"/><circle cx="214" cy="146" r="8"/><circle cx="266" cy="146" r="8"/>
    <circle cx="318" cy="146" r="8"/><circle cx="370" cy="146" r="8"/><circle cx="422" cy="146" r="8"/><circle cx="474" cy="146" r="8"/>
  </g>
  <text x="530" y="134" font-size="16" fill="#bbb">…</text>
  <!-- DS1307 pins (already used) -->
  <g fill="none" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="4 3">
    <circle cx="162" cy="112" r="11"/><circle cx="214" cy="112" r="11"/><circle cx="162" cy="146" r="11"/><circle cx="214" cy="146" r="11"/>
  </g>
  <text x="188" y="202" text-anchor="middle" font-size="12" fill="#e8f5ea">DS1307 (giữ nguyên)</text>
  <!-- used pins -->
  <circle cx="370" cy="146" r="11" fill="none" stroke="#2e7dd7" stroke-width="3"/>
  <circle cx="318" cy="146" r="11" fill="none" stroke="#111" stroke-width="3"/>
  
  

  <!-- breadboard area -->
  <rect x="620" y="300" width="310" height="300" rx="10" fill="#f3f1ea" stroke="#d4cfc0"/>
  <text x="775" y="324" text-anchor="middle" font-size="13" fill="#666">breadboard</text>

  <!-- circuit A: Timer LED -->
  <g>
    <text x="655" y="358" font-size="15" font-weight="700" fill="#2e7dd7">LED Timer (GPIO17)</text>
    <!-- resistor -->
    <rect x="680" y="380" width="70" height="20" rx="6" fill="#e9d3a5" stroke="#8a6d3b"/>
    <rect x="696" y="380" width="5" height="20" fill="#e67e22"/><rect x="708" y="380" width="5" height="20" fill="#e67e22"/><rect x="720" y="380" width="5" height="20" fill="#8e5a2b"/>
    <text x="715" y="418" text-anchor="middle" font-size="12" fill="#333">330 Ω</text>
    <!-- LED -->
    <path d="M790 375 L790 405 L815 390 Z" fill="#4aa3ff" stroke="#1d5fa8"/>
    <line x1="815" y1="375" x2="815" y2="405" stroke="#1d5fa8" stroke-width="3"/>
    <text x="790" y="430" font-size="11" fill="#333" text-anchor="end">(+) dài</text>
    <text x="818" y="430" font-size="11" fill="#333">(−) ngắn</text>
    <line x1="750" y1="390" x2="790" y2="390" stroke="#555" stroke-width="3"/>
    <line x1="815" y1="390" x2="880" y2="390" stroke="#555" stroke-width="3"/>
  </g>
  

  <!-- wires -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A: pin 11 (GPIO17) -> resistor A left -->
    <path d="M370 157 L370 300 L645 300 L645 390 L680 390" stroke="#2e7dd7"/>
    <!-- A: LED cathode -> pin 9 (GND) -->
    <path d="M880 390 L900 390 L900 290 L600 290 L600 200 L318 200 L318 157" stroke="#111"/>
    <!-- B: pin 12 (GPIO18) -> resistor B left -->
    
    <!-- B: LED cathode -> pin 14 (GND) -->
    
  </g>

  <!-- pin numbers -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">
    <text x="121" y="96">2</text><text x="173" y="96">4</text><text x="225" y="96">6</text><text x="277" y="96">8</text>
    <text x="329" y="96">10</text><text x="381" y="96">12</text><text x="433" y="96">14</text><text x="485" y="96">16</text>
    <text x="121" y="174">1</text><text x="173" y="174">3</text><text x="225" y="174">5</text><text x="277" y="174">7</text>
    <text x="329" y="174">9</text><text x="381" y="174">11</text><text x="433" y="174">13</text><text x="485" y="174">15</text>
  </g>
  <!-- table -->
  <g font-size="14">
    <rect x="30" y="310" width="560" height="290" rx="10" fill="#f6f7f9" stroke="#d6d9de"/>
    <text x="50" y="340" font-weight="700">Mạch</text>
    <text x="150" y="340" font-weight="700">Từ chân Pi</text>
    <text x="330" y="340" font-weight="700">Qua</text>
    <text x="470" y="340" font-weight="700">Về chân Pi</text>
    <text x="50" y="372" fill="#2e7dd7" font-weight="700">LED Timer</text>
    <text x="150" y="372">Chân 11 (GPIO17)</text>
    <text x="330" y="372">330 Ω → LED</text>
    <text x="470" y="372">Chân 9 (GND)</text>
    <text x="50" y="446" fill="#333">• Chân DÀI của LED (+, anode) quay về phía điện trở.</text>
    <text x="50" y="472" fill="#333">• Chân NGẮN (−, cathode, cạnh vát) nối về GND.</text>
    <text x="50" y="498" fill="#333">• Điện trở 220–470 Ω đều được (dòng ≈ 3–6 mA).</text>
    <text x="50" y="524" fill="#333">• Không nối LED thẳng vào GPIO khi thiếu điện trở.</text>
    <text x="50" y="550" fill="#333">• Chân 3, 4, 5, 6 vẫn dành cho DS1307 như cũ.</text>
    <text x="50" y="576" fill="#333">• Tắt Pi trước khi cắm/rút dây.</text>
  </g>
</svg>
